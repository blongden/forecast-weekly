name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION:       eu-west-2
  ECR_REGISTRY:     711695043600.dkr.ecr.eu-west-2.amazonaws.com
  ECR_REPOSITORY:   cdk-hnb659fds-container-assets-711695043600-eu-west-2
  TASK_DEF_FAMILY:  EnergyAnalysisTaskDefE9704C45
  CLUSTER_ARN:      arn:aws:ecs:eu-west-2:711695043600:cluster/EnergyAnalysis-ClusterEB0386A7-zz6UZzcErUMW
  EB_RULE:          EnergyAnalysis-DailyRunDEF7747D-lt8qiUZido6W
  EB_ROLE_ARN:      arn:aws:iam::711695043600:role/EnergyAnalysis-TaskDefEventsRoleFB3B67B8-KO4PTRbTzuPU

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register new task definition revision
        id: task-def
        run: |
          IMAGE="${{ steps.build.outputs.image }}"

          # Fetch current task definition, strip read-only fields, swap image
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --query 'taskDefinition' \
            --output json \
          | jq --arg IMAGE "$IMAGE" '
              .containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status,
                    .requiresAttributes, .placementConstraints,
                    .compatibilities, .registeredAt, .registeredBy)
            ' > new-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $NEW_ARN"

      - name: Update EventBridge target to new revision
        run: |
          NEW_TASK_DEF_ARN="${{ steps.task-def.outputs.task_def_arn }}"

          aws events put-targets \
            --rule "$EB_RULE" \
            --region "$AWS_REGION" \
            --targets "[{
              \"Id\": \"Target0\",
              \"Arn\": \"$CLUSTER_ARN\",
              \"RoleArn\": \"$EB_ROLE_ARN\",
              \"Input\": \"{}\",
              \"EcsParameters\": {
                \"TaskDefinitionArn\": \"$NEW_TASK_DEF_ARN\",
                \"TaskCount\": 1,
                \"LaunchType\": \"FARGATE\",
                \"NetworkConfiguration\": {
                  \"awsvpcConfiguration\": {
                    \"Subnets\": [\"subnet-0c6c3a2293c8d8710\", \"subnet-00edaae9544fd9ed8\", \"subnet-0b8023abd08c34477\"],
                    \"SecurityGroups\": [\"sg-0b8fe0f030d1de0f7\"],
                    \"AssignPublicIp\": \"ENABLED\"
                  }
                },
                \"EnableECSManagedTags\": false,
                \"EnableExecuteCommand\": false
              }
            }]"

          echo "EventBridge updated to $NEW_TASK_DEF_ARN"
